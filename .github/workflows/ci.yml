name: ARVX 588 Bot CI Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js v26 LTS
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Syntax & YAML Config
        run: |
          node --check index.js
          node -e "import('js-yaml').then(y => import('fs').then(fs => y.default.load(fs.readFileSync('config.yml', 'utf8'))))"
