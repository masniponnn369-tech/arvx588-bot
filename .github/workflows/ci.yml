name: ARVX 588 Bot CI Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Verify Syntax & YAML Config
        run: |
          node --check index.js
          node -e "import('js-yaml').then(y => import('fs').then(fs => y.default.load(fs.readFileSync('config.yml', 'utf8'))))"
